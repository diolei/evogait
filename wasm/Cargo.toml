[package]
name = "evogait-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
evogait-sim-core = { path = "../sim-core" }
# Pinned to match the installed wasm-bindgen CLI (see scripts/build-walker-wasm.sh).
wasm-bindgen = "=0.2.126"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
